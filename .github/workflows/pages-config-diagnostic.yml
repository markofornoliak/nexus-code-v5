name: Diagnose NEXUS Pages configuration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure or enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
