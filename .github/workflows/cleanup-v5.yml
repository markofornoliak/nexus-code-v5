name: Clean temporary NEXUS v5 workflows

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Remove temporary release workflows
        shell: bash
        run: |
          rm -f \
            .github/workflows/diagnose-v5.yml \
            .github/workflows/diagnose-v5-compact.yml \
            .github/workflows/lint-compact.yml \
            .github/workflows/format-compact.yml \
            .github/workflows/format-fix-v5.yml \
            .github/workflows/format-fix.yml \
            .github/workflows/test-compact.yml \
            .github/workflows/duplicate-id-diagnostic.yml \
            .github/workflows/duplicate-ids-v5.yml \
            .github/workflows/fix-duplicate-ids-v5.yml \
            .github/workflows/deploy-once-v5.yml \
            .github/workflows/pages-config-diagnostic.yml \
            .github/workflows/pages-verify-v5.yml \
            .github/workflows/cleanup-v5.yml
          rm -rf .nexus-bootstrap
          rm -f .nexus-init
      - name: Commit clean release repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository already clean."
            exit 0
          fi
          git commit -m "Clean NEXUS v5 release workflows"
          git push origin HEAD:main
