name: Format NEXUS v5.1 release

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: format-v51-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.head_ref == 'design-content-v51'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Apply canonical Prettier output
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --quiet --branch design-content-v51 "https://github.com/${GITHUB_REPOSITORY}.git" release
          cd release
          npm ci --silent
          npm run format
          rm -f .github/workflows/format-v51-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format NEXUS v5.1 release"
          git push origin HEAD:design-content-v51
