name: Fix NEXUS v5.1 lint imports

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: fix-v51-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.head_ref == 'design-content-v51'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove unused landing icons
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --quiet --branch design-content-v51 "https://github.com/${GITHUB_REPOSITORY}.git" release
          cd release
          sed -i '/^  Braces,$/d; /^  Cpu,$/d; /^  FlaskConical,$/d; /^  Layers3,$/d; /^  Sparkles,$/d' src/pages/LandingPage.tsx
          rm -f .github/workflows/fix-v51-lint.yml
          rm -f .github/workflows/lint-v51-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove unused NEXUS v5.1 landing icon imports"
          git push origin HEAD:design-content-v51
