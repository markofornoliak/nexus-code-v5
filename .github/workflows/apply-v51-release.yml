name: Apply NEXUS v5.1 release

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-v51-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-release:
    if: github.head_ref == 'design-content-v51'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Apply verified NEXUS v5.1 release
        shell: bash
        run: bash <(curl --fail --silent --show-error --location "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/design-content-v51/scripts/apply-v51-release.sh")
