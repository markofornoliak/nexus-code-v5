name: Diagnose NEXUS v5 payload compact

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print payload hashes
        shell: bash
        run: |
          git clone --depth 1 --branch main https://github.com/markofornoliak/nexus-code-v5.git payload >/dev/null 2>&1
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('payload')
          for path in sorted(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts:
                  continue
              data = path.read_bytes()
              if len(data) >= 1000:
                  print(f'{path.relative_to(root)}|{len(data)}|{hashlib.sha256(data).hexdigest()}')
          PY
