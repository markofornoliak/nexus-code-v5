name: Diagnose NEXUS v5 payload compact

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print payload hashes
        shell: bash
        run: |
          git clone --depth 1 --branch main https://github.com/markofornoliak/nexus-code-v5.git payload >/dev/null 2>&1
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for path in sorted(Path('payload/.nexus-bootstrap').glob('*')):
              if path.is_file():
                  data = path.read_bytes()
                  print(f'{path.name}|{len(data)}|{hashlib.sha256(data).hexdigest()}')
          PY
