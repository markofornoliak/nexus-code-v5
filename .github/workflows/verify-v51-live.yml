name: Verify live NEXUS v5.1

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: verify-v51-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live:
    if: github.head_ref == 'verify-v51-live'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inventory published v5.1 shell and assets
        shell: bash
        env:
          SITE_URL: https://markofornoliak.github.io/nexus-code-v5/
          SITE_ORIGIN: https://markofornoliak.github.io
        run: |
          set -euo pipefail
          html="$(mktemp)"
          script="$(mktemp)"
          style="$(mktemp)"

          curl --fail --silent --show-error --location --output "$html" "$SITE_URL"
          script_path="$(grep -oE 'src="[^"]+\.js"' "$html" | head -n 1 | cut -d '"' -f 2)"
          style_path="$(grep -oE 'href="[^"]+\.css"' "$html" | head -n 1 | cut -d '"' -f 2)"
          test -n "$script_path"
          test -n "$style_path"

          curl --fail --silent --show-error --location --output "$script" "${SITE_ORIGIN}${script_path}"
          curl --fail --silent --show-error --location --output "$style" "${SITE_ORIGIN}${style_path}"

          echo "JavaScript asset: ${script_path} ($(wc -c < "$script") bytes)"
          echo "CSS asset: ${style_path} ($(wc -c < "$style") bytes)"
          echo "JavaScript SHA-256: $(sha256sum "$script" | cut -d ' ' -f 1)"
          echo "CSS SHA-256: $(sha256sum "$style" | cut -d ' ' -f 1)"

          for marker in '5.1.0' 'Build software that behaves like a system.' 'Production Automation' 'Open curriculum map'; do
            if grep -Fq "$marker" "$script"; then
              echo "JS marker present: $marker"
            else
              echo "JS marker absent: $marker"
            fi
          done

          for marker in '.v51-landing' '.v51-track-page' '.v51-projects-page' '--v51-panel'; do
            if grep -Fq -- "$marker" "$style"; then
              echo "CSS marker present: $marker"
            else
              echo "CSS marker absent: $marker"
            fi
          done

          echo "Asset inventory completed."
