name: Verify NEXUS v5 GitHub Pages deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexus-v5-pages-verification
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released main branch
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Full release quality gate
        run: |
          npm audit --omit=dev
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test
      - name: Build repository-subpath release
        env:
          VITE_BASE_PATH: /nexus-code-v5/
        run: npm run build
      - name: Static e2e smoke
        run: npm run test:e2e
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
