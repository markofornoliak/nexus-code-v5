name: Verify live NEXUS Pages now

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify page and built assets
        shell: bash
        env:
          SITE_URL: https://markofornoliak.github.io/nexus-code-v5/
          SITE_ORIGIN: https://markofornoliak.github.io
        run: |
          set -euo pipefail

          html="$(mktemp)"
          curl \
            --fail \
            --location \
            --retry 30 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 30 \
            --output "$html" \
            "$SITE_URL"

          grep -Fq "NEXUS CODE v5" "$html"
          grep -Fq "/nexus-code-v5/assets/" "$html"

          script_path="$(grep -oE 'src="[^"]+\.js"' "$html" | head -n 1 | cut -d '"' -f 2)"
          style_path="$(grep -oE 'href="[^"]+\.css"' "$html" | head -n 1 | cut -d '"' -f 2)"

          test -n "$script_path"
          test -n "$style_path"

          curl --fail --location --retry 3 --output /dev/null "${SITE_ORIGIN}${script_path}"
          curl --fail --location --retry 3 --output /dev/null "${SITE_ORIGIN}${style_path}"

          echo "Live NEXUS CODE v5 Pages verification passed."
