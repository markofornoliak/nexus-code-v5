name: Diagnose duplicate curriculum ids

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose generated task ids
        shell: bash
        run: |
          git clone --depth 1 --branch main https://github.com/markofornoliak/nexus-code-v5.git app >/dev/null 2>&1
          cd app
          npm ci --silent >/dev/null 2>&1
          cat > src/content/duplicate-id-diagnostic.test.ts <<'TS'
          import { getOrderedLessons, tracks } from "./registry";

          describe("duplicate id diagnostic", () => {
            it("prints duplicate generated task ids", () => {
              const owners = new Map<string, string[]>();
              for (const track of tracks) {
                for (const lesson of getOrderedLessons(track)) {
                  for (const task of [...lesson.tasks, lesson.bonusTask]) {
                    const entries = owners.get(task.id) ?? [];
                    entries.push(`${track.id}/${lesson.id}`);
                    owners.set(task.id, entries);
                  }
                }
              }
              const duplicates = [...owners.entries()].filter(([, entries]) => entries.length > 1);
              console.log(JSON.stringify(duplicates));
              expect(duplicates).toEqual([]);
            });
          });
          TS
          npx vitest run src/content/duplicate-id-diagnostic.test.ts --reporter=verbose
