name: NEXUS Pages live smoke

on:
  workflow_run:
    workflows: ["Deploy NEXUS to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-live-smoke
  cancel-in-progress: true

jobs:
  verify-live-site:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify published application and assets
        shell: bash
        env:
          SITE_URL: https://markofornoliak.github.io/nexus-code-v5/
        run: |
          set -euo pipefail

          html="$(mktemp)"
          curl \
            --fail \
            --location \
            --retry 20 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 30 \
            --output "$html" \
            "$SITE_URL"

          grep -Fq "NEXUS CODE v5" "$html"
          grep -Fq "/nexus-code-v5/assets/" "$html"

          script_path="$(grep -oE 'src="[^"]+\.js"' "$html" | head -n 1 | cut -d '"' -f 2)"
          style_path="$(grep -oE 'href="[^"]+\.css"' "$html" | head -n 1 | cut -d '"' -f 2)"

          test -n "$script_path"
          test -n "$style_path"

          curl --fail --location --retry 3 --output /dev/null "https://markofornoliak.github.io${script_path}"
          curl --fail --location --retry 3 --output /dev/null "https://markofornoliak.github.io${style_path}"

          echo "Live Pages smoke passed for ${SITE_URL}"
