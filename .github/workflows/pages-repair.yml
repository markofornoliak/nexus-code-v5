name: NEXUS Pages repair deployment

on:
  pull_request:
  workflow_dispatch:

permissions: write-all

concurrency:
  group: pages-repair
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages workflow source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          set +e
          output="$(gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/pages" \
            -f build_type=workflow 2>&1)"
          status=$?
          set -e

          printf '%s\n' "$output"

          if [ "$status" -ne 0 ]; then
            if printf '%s' "$output" | grep -Eqi 'already exists|status 409|HTTP 409'; then
              gh api \
                --method PUT \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/${GITHUB_REPOSITORY}/pages" \
                -f build_type=workflow
            else
              exit "$status"
            fi
          fi

  build:
    runs-on: ubuntu-latest
    needs: enable
    steps:
      - name: Checkout main release
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build repository-subpath release
        env:
          VITE_BASE_PATH: /nexus-code-v5/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
