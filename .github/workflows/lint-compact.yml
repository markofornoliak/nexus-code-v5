name: NEXUS lint compact

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Run lint with compact output
        shell: bash
        run: |
          git clone --depth 1 --branch main https://github.com/markofornoliak/nexus-code-v5.git app >/dev/null 2>&1
          cd app
          npm ci --silent >/dev/null 2>&1
          npm run lint
