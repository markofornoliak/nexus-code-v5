name: Diagnose NEXUS v5.1 TypeScript

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: typecheck-v51-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'design-content-v51'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Run compact TypeScript diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch design-content-v51 "https://github.com/${GITHUB_REPOSITORY}.git" release
          cd release
          npm ci --silent
          npm run typecheck -- --pretty false
