name: Fix NEXUS v5.1 accent token

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: fix-v51-accent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.head_ref == 'design-content-v51'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Apply valid design-system accent
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --quiet --branch design-content-v51 "https://github.com/${GITHUB_REPOSITORY}.git" release
          cd release
          sed -i 's/accent: "coral"/accent: "amber"/' src/content/cpp/performanceWorld.ts
          grep -Fq 'accent: "amber"' src/content/cpp/performanceWorld.ts
          rm -f .github/workflows/fix-v51-accent.yml
          rm -f .github/workflows/typecheck-v51-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix NEXUS v5.1 C++ world accent token"
          git push origin HEAD:design-content-v51
