name: Finalize NEXUS CODE v5

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: nexus-v5-finalize
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: agent/release-nexus-code-v5
          fetch-depth: 0

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "5.0.0"
          test -f src/main.tsx
          test -f package-lock.json
          test -f .github/workflows/ci.yml
          test -f .github/workflows/deploy.yml
          if [ -d .bootstrap ]; then
            echo "Bootstrap payload must not remain in the release tree" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting check
        run: npm run format:check

      - name: Unit and integration tests
        run: npm run test

      - name: Curriculum validation
        run: npm run validate:content

      - name: GitHub Pages subpath build
        env:
          VITE_BASE_PATH: /nexus-code-v5/
        run: npm run build

      - name: End-to-end deployment smoke checks
        run: npm run test:e2e

      - name: Remove one-time release controller
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/release-control.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize NEXUS CODE v5 release"

      - name: Publish verified source to main
        run: git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify-and-publish
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
