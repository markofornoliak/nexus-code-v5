name: Diagnose NEXUS CODE v5 release payload

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: nexus-v5-payload-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: agent/release-nexus-code-v5
          fetch-depth: 0

      - name: Record remote payload manifest
        shell: bash
        run: |
          set -euo pipefail
          : > .bootstrap/actual-manifest.txt
          for file in .bootstrap/release-*; do
            bytes=$(wc -c < "$file" | tr -d ' ')
            hash=$(sha256sum "$file" | awk '{print $1}')
            printf '%s %s %s\n' "$(basename "$file")" "$bytes" "$hash" >> .bootstrap/actual-manifest.txt
          done
          cat .bootstrap/release-* | sha256sum | awk '{print "combined-b85 " $1}' >> .bootstrap/actual-manifest.txt
          cat .bootstrap/actual-manifest.txt

      - name: Commit diagnostic manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .bootstrap/actual-manifest.txt
          git commit -m "Record v5 payload diagnostics"
          git push origin HEAD:agent/release-nexus-code-v5
